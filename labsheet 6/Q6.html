  <main class="container section narrow"><h1>Contact Form Validation</h1><form id="validateForm" novalidate><label>Name<input id="vName" type="text" placeholder="Your name"></label><small class="error" id="vNameError"></small><label>Email<input id="vEmail" type="email" placeholder="name@example.com"></label><small class="error" id="vEmailError"></small><label>Message<textarea id="vMessage" rows="5" placeholder="Your message"></textarea></label><small class="error" id="vMessageError"></small><button class="btn">Submit</button><p class="success" id="vSuccess"></p></form></main>
