<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>
</head>
<body>

    <h1>Survey Form</h1>

    <form>

        <fieldset>

            <legend>Personal Information</legend>

            Name:
            <input type="text">
            <br><br>

            Email:
            <input type="email">
            <br><br>

        </fieldset>

        <br>

        <fieldset>

            <legend>Feedback</legend>

            Are you satisfied?

            <input type="radio" name="satisfaction">
            Yes

            <input type="radio" name="satisfaction">
            No

        </fieldset>

        <br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
